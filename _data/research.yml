intro: >-
  My work sits between distributed systems and AI. I build computing
  continuum infrastructure that observes its own behaviour, reasons about the causes
  behind it, and adapts without a human in the loop. A large part of that is the
  data communications between the devices: intelligent data protocols and application-layer designs
  that decide what gets sent, when, and to which tier, rather than moving everything
  to the cloud and paying for it in energy and latency.

interests:
  - Distributed computing continuum systems
  - Intelligent data and application-layer protocols
  - Learning techniques in IoT
  - AI across computing continuum
  - Cognition and causality in computing systems
  - Cyber-physical continuum

projects:
  - name: TALENTS — Towards Artificial Intelligence Empowered Green Internet of Things
    meta: EU Marie Skłodowska-Curie Actions Staff Exchange · ongoing
    url: https://www.su.se/english/research/research-catalogue/research-projects/9/talents-towards-artificial-intelligence-empowered-green-internet-of-things
    summary: >-
      Energy-autonomous IoT for continuous water quality monitoring, combining energy
      harvesting, efficient communication, TinyML and cloud AI. The project targets UN
      Sustainable Development Goal 6 and includes researcher training across EU and
      non-EU partners.

  - name: HCSCM — Heterogeneous Computing Continuum for a Sustainable Smart City Management
    meta: Baltic Sea university consortium · completed
    url: https://www.su.se/english/research/research-catalogue/research-projects/7/heterogeneous-computing-continuum-for-a-sustainable-smart-city-management-hcscm
    summary: >-
      Scalable and secure integration of IoT, edge and cloud computing, aimed at
      improving sustainability, energy use and service delivery across diverse urban
      environments.

directions:
  - title: Resilience in the computing continuum
    summary: >-
      Keeping heterogeneous deployments running through failures that were never
      anticipated at design time — detection, isolation and recovery that do not
      depend on a central controller staying reachable.

  - title: Human-body-inspired computing systems
    summary: >-
      Borrowing from how biological systems regulate themselves: local reflexes,
      homeostasis, and healing that proceeds without instruction from the centre.
      The question is which of these mechanisms translate usefully into distributed
      infrastructure, and which are only appealing as metaphors.

  - title: CrowMQ
    image: /assets/img/crowmq.gif
    image_alt: CrowMQ logo
    summary: >-
      An intelligent messaging protocol for distributed AI systems, currently in development.

