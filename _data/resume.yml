experience:
  - role: Senior Backend Engineer
    org: Klarna
    when: 2022 — now
    where: Stockholm
    summary: >-
      Own the settlement service that reconciles roughly 40 million
      transactions a day against bank statements.
    points:
      - Cut end-of-day reconciliation from 6 hours to 25 minutes by
        replacing a nightly batch job with an incremental ledger.
      - Led the migration of 14 services off a shared Postgres instance,
        with no downtime and no data loss.
      - Mentor two junior engineers; run the team's on-call review.

  - role: Backend Engineer
    org: Tink
    when: 2019 — 2022
    where: Stockholm
