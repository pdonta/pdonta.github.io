      Worked on the bank connectivity layer, integrating with 60+ European
      banks that each interpreted the same standard differently.
    points:
      - Built the retry and idempotency framework still used across the
        platform.
      - Reduced integration failure rate from 4% to under 0.5%.

  - role: Software Engineer
    org: Bolt
    when: 2017 — 2019
    where: Tallinn
    summary: >-
      First backend hire on the driver payouts team.
    points:
