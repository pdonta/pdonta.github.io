# The line under your name. Keep it to what you actually do.
statement: >-
  I work on bringing AI across the computing continuum — the span from small
  sensing devices, through edge nodes, to the cloud. That means learning methods
  that run where the resources are scarce, intelligent data and application-layer
  protocols that decide what is worth sending and when, and systems that can
  recover on their own when part of the deployment fails.

