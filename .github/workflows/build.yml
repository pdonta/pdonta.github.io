name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Sync publications from ORCID
        env:
          CONTACT_EMAIL: praveen.donta@dsv.su.se
        continue-on-error: true
        run: python3 scripts/sync_orcid.py

      - name: Commit refreshed publication list
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.yml .cache/crossref.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No publication changes."
          else
            git commit -m "Sync publications from ORCID"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
